name: Code Quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.10"

      # --locked fails if uv.lock is out of date with pyproject.toml.
      - name: Install the package, its extras and the development tools
        run: uv sync --all-extras --locked

      - name: Check types
        if: ${{ always() }}
        run: uv run --no-sync mypy

      - name: Check linting
        if: ${{ always() }}
        run: uv run --no-sync ruff check gnsstools tests

      - name: Check formatting
        if: ${{ always() }}
        run: uv run --no-sync ruff format --check gnsstools tests
