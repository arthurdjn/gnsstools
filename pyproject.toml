[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gnsstools"]

[tool.hatch.build.targets.sdist]
include = [
    "/gnsstools",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
]

[project]
name = "gnsstools"
version = "0.0.1"
description = "Read RINEX and SP3 files into pandas DataFrames and handle GNSS time conversions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arthur Dujardin", email = "arthurdujardin.dev@gmail.com" }]
keywords = [
    "gnss",
    "gps",
    "galileo",
    "glonass",
    "rinex",
    "sp3",
    "ephemeris",
    "orbit",
    "geodesy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "shapely>=2.0.0",
]

[project.optional-dependencies]
# Fallback reader for the formats gnsstools does not parse itself (Hatanaka-compressed RINEX, NetCDF, ...).
georinex = ["georinex>=1.16.0"]

[project.urls]
Homepage = "https://github.com/arthurdjn/gnsstools"
Repository = "https://github.com/arthurdjn/gnsstools"
Issues = "https://github.com/arthurdjn/gnsstools/issues"

[tool.uv]
package = true
exclude-newer = "14 days"
