[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gnsstools"]

[tool.hatch.build.targets.sdist]
include = [
    "/gnsstools",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
]

[project]
name = "gnsstools"
version = "0.0.1"
description = "Read RINEX and SP3 files into pandas DataFrames and handle GNSS time conversions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arthur Dujardin", email = "arthurdujardin.dev@gmail.com" }]
keywords = [
    "gnss",
    "gps",
    "galileo",
    "glonass",
    "rinex",
    "sp3",
    "ephemeris",
    "orbit",
    "geodesy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "shapely>=2.0.0",
]

[project.optional-dependencies]
# Fallback reader for the formats gnsstools does not parse itself (Hatanaka-compressed RINEX, NetCDF, ...).
georinex = ["georinex>=1.16.0"]

[project.urls]
Homepage = "https://github.com/arthurdjn/gnsstools"
Repository = "https://github.com/arthurdjn/gnsstools"
Issues = "https://github.com/arthurdjn/gnsstools/issues"
Changelog = "https://github.com/arthurdjn/gnsstools/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=1.18.0",
    "pandas-stubs>=2.2.0",
    "pytest>=8.4.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.0",
    "types-shapely>=2.0.0",
]

[tool.uv]
package = true
exclude-newer = "14 days"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["gnsstools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
# Known bugs are marked xfail: a fix makes them pass, and a strict xfail then fails until the marker is removed.
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["gnsstools"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
files = ["gnsstools", "tests"]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
# georinex ships no type information.
module = ["georinex"]
ignore_missing_imports = true
